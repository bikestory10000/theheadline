name: Refresh IG token (60일 토큰 주 1회 갱신)

on:
  schedule:
    - cron: "0 3 * * 1"   # 매주 월요일 UTC 03:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh
        id: r
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$TOKEN" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('access_token',''))")
          [ -z "$NEW" ] && { echo "갱신 실패"; exit 1; }
          echo "::add-mask::$NEW"
          echo "new=$NEW" >> $GITHUB_OUTPUT
      - name: Save to Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # repo secret 쓰기 권한 PAT
        run: gh secret set IG_ACCESS_TOKEN --repo ${{ github.repository }} --body "${{ steps.r.outputs.new }}"
